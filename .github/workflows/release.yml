name: Package and Release

# Thin caller. The pipeline lives in RGXMods/.github so every RGX addon shares
# one place to fix packaging, changelog extraction and release notes.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha*'
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel to publish
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

jobs:
  release:
    permissions:
      contents: write
    uses: RGXMods/.github/.github/workflows/release.yml@main
    secrets: inherit
    with:
      release_type: ${{ github.event.inputs.release_type || '' }}
      curseforge: true
